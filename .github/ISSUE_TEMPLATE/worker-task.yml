name: Worker Task (Aufgabe für einen Agenten)
description: Clearly scoped task that a worker agent can implement in a single Pull Request
labels: ["worker-task"]
body:
  - type: markdown
    attributes:
      value: |
        An issue is the binding contract with the worker. The more precise the interface
        signatures and acceptance tests, the less the model needs to guess. Workflow:
        `AGENTS.md` (section „Worker-Aufgaben“).

  - type: textarea
    id: ziel
    attributes:
      label: Ziel
      description: What should change afterwards? One or two sentences.
    validations:
      required: true

  - type: textarea
    id: dateien
    attributes:
      label: Betroffene Dateien
      description: Only these files may be modified (plus test files).
      placeholder: |
        - sandbox/review_tick.py (pick_pr)
        - tests/test_review_tick.py
    validations:
      required: true

  - type: textarea
    id: schnittstellen
    attributes:
      label: Schnittstellen
      description: New or modified functions with exact signature, return value, and error behavior.
      render: python
      placeholder: |
        def project_done(state: dict) -> frozenset:
            """Erledigte Nacharbeiten des aktiven Projekts; leer, wenn der Zustand fehlt."""
    validations:
      required: true

  - type: textarea
    id: nicht-anfassen
    attributes:
      label: Nicht Teil dieser Aufgabe
      description: What is explicitly out of scope or will not be refactored.
      placeholder: |
        - keine Änderung an install.sh oder den systemd-Units
        - kein Umbenennen bestehender Funktionen
    validations:
      required: true

  - type: textarea
    id: akzeptanztests
    attributes:
      label: Akzeptanztests
      description: |
        pytest code that the worker copies verbatim into `tests/acceptance/test_issue_<Number>.py`.
        The CI check `acceptance-guard` compares the file against this block. Offline only (mocks for network/gh).
        Leave empty only if there are no fixed acceptance tests.
      render: python
    validations:
      required: false

  - type: textarea
    id: fertig
    attributes:
      label: Fertig, wenn
      value: |
        - [ ] Akzeptanztests grün
        - [ ] Weitere Tests decken das neue Verhalten ab (Netzwerk nur über Fakes)
    validations:
      required: true

  - type: dropdown
    id: merge-modus
    attributes:
      label: Merge-Modus
      description: Automatic = Reviewer agent merges on green CI. Manual = Reviewer approves, Stephan merges.
      options:
        - automatisch nach Review
        - manuell durch Stephan (Betrieb, Server, Zugangsdaten)
    validations:
      required: true

  - type: textarea
    id: kontext
    attributes:
      label: Kontext
      description: ROADMAP milestone, logs, examples, dependencies. Never include credentials.
    validations:
      required: false

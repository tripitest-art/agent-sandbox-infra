name: acceptance-guard

# pull_request_target: läuft immer mit Workflow und Skript aus `main`, nicht aus dem PR.
# Ein Worker kann den Check also nicht im eigenen PR abschalten. Sicher, weil hier kein
# Code aus dem PR ausgeführt wird: das Skript liest den PR nur über die GitHub-API.
# PR-Texte niemals per ${{ }} in run:-Zeilen einsetzen (Shell-Injection).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: acceptance-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Akzeptanztests und Test-Infrastruktur prüfen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/acceptance_guard.py

# /etc/systemd/system/ollama.service.d/override.conf  (Gaming-PC, nicht die Sandbox)
# Danach: sudo systemctl daemon-reload && sudo systemctl restart ollama
# Stand 01.10.2026, entspricht dem laufenden PC (Runbook ollama-wol-setup).
[Service]
# Im LAN erreichbar; firewalld lässt 11434 nur vom WoL-Proxy (192.168.0.210) zu
Environment="OLLAMA_HOST=0.0.0.0:11434"
# 15 min nach der letzten Anfrage entladen -> danach darf der PC herunterfahren
Environment="OLLAMA_KEEP_ALIVE=15m"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_CONTEXT_LENGTH=131072"
# Flash Attention MUSS an sein: KV q8_0 lädt sonst nicht (HTTP 500). Auf RDNA2 stabil
# (0 Ring-Timeouts in allen Benchmarks); siehe hardware/amd-rdna2-tuning.md.
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

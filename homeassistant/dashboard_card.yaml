# Im Home Assistant Dashboard (Lovelace) als 'Manueller Code' oder 'Vertikaler Stapel' einfügen:
type: vertical-stack
cards:
  - type: entities
    title: 🖥️ Lokaler KI-Server (Ollama & WoL)
    entities:
      - entity: sensor.llm_gaming_pc
        icon: mdi:desktop-tower
        name: PC Status
      - type: attribute
        entity: sensor.llm_gaming_pc
        attribute: active_requests
        name: Aktive Agenten-Requests
        icon: mdi:robot-outline

  # GPU VRAM & Power Metriken
  - type: entities
    title: ⚡ AMD RX 6800 XT Telemetrie
    entities:
      - type: attribute
        entity: sensor.llm_gaming_pc
        attribute: hw.gpu.vram_used_gb
        name: VRAM Belegung (GB)
        icon: mdi:expansion-card
      - type: attribute
        entity: sensor.llm_gaming_pc
        attribute: hw.gpu.power_w
        name: GPU Verbrauch (Watt)
        icon: mdi:flash
      - type: attribute
        entity: sensor.llm_gaming_pc
        attribute: hw.gpu.temp_junction_c
        name: Hotspot Temperatur (°C)
        icon: mdi:thermometer

  # Live-Log Anzeige (Markdown)
  - type: markdown
    title: 🧠 Qwen Agent Live-Log
    content: >
      ```text
      {{ state_attr('sensor.qwen_worker_log', 'log') }}
      ```

  # Slot-Telemetrie: je Worker-Slot eine Karte (Status, Auftrag, Modell) aus
  # sensor.qwen_worker_slot_1/2, gespeist per Webhook (sandbox/qwen_webhook.py).
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.qwen_worker_slot_1
        primary: "Slot 1 · {{ states('sensor.qwen_worker_slot_1') }}"
        secondary: >-
          {% set title = state_attr('sensor.qwen_worker_slot_1', 'title') %}
          {% set message = state_attr('sensor.qwen_worker_slot_1', 'message') %}
          {{ title or message or 'Kein Auftrag' }}
        icon: >-
          {% set s = states('sensor.qwen_worker_slot_1') %}
          {% if s == 'running' %}mdi:robot{% elif s == 'idle' %}mdi:sleep{% else %}mdi:help-circle{% endif %}
        icon_color: >-
          {% set s = states('sensor.qwen_worker_slot_1') %}
          {% if s == 'running' %}blue{% elif s == 'idle' %}grey{% else %}red{% endif %}
        tap_action:
          action: more-info

      - type: custom:mushroom-template-card
        entity: sensor.qwen_worker_slot_2
        primary: "Slot 2 · {{ states('sensor.qwen_worker_slot_2') }}"
        secondary: >-
          {% set title = state_attr('sensor.qwen_worker_slot_2', 'title') %}
          {% set message = state_attr('sensor.qwen_worker_slot_2', 'message') %}
          {{ title or message or 'Kein Auftrag' }}
        icon: >-
          {% set s = states('sensor.qwen_worker_slot_2') %}
          {% if s == 'running' %}mdi:robot{% elif s == 'idle' %}mdi:sleep{% else %}mdi:help-circle{% endif %}
        icon_color: >-
          {% set s = states('sensor.qwen_worker_slot_2') %}
          {% if s == 'running' %}blue{% elif s == 'idle' %}grey{% else %}red{% endif %}
        tap_action:
          action: more-info

  # Workflow-Status aus sensor.agenten_workflow_status (sandbox/ha_status.py per Webhook)
  - type: markdown
    title: 📋 Projekt-Matrix
    content: |-
      {% set projekte = state_attr('sensor.agenten_workflow_status', 'projekte') or [] %}
      | Projekt | bereit | in-arbeit | blockiert | PRs offen | rot | laufend |
      |---|---|---|---|---|---|---|
      {% for p in projekte -%}
      {% if p.fehler is defined -%}
      | {{ p.name }} | fehler: {{ p.fehler }} | | | | | |
      {% else -%}
      | {{ p.name }} | {{ p.issues['bereit'] }} | {{ p.issues['in-arbeit'] }} | {{ p.issues['blockiert'] }} | {{ p.prs.offen }} | {{ p.prs.rot }} | {{ p.prs.laufend }} |
      {% endif -%}
      {% endfor %}

  - type: custom:mushroom-template-card
    entity: sensor.agenten_workflow_status
    primary: "Braucht Stephan: {{ states('sensor.agenten_workflow_status') }}"
    secondary: >-
      {% set projekte = state_attr('sensor.agenten_workflow_status', 'projekte') or [] %}
      {% for p in projekte if p.prs is defined %}{% for pr in p.prs.wartet_auf_stephan %}#{{ pr.number }} {{ pr.title }}; {% endfor %}{% endfor %}
    icon: mdi:account-alert
    icon_color: >-
      {% if states('sensor.agenten_workflow_status') | int(0) > 0 %}red{% else %}green{% endif %}
    tap_action:
      action: more-info

  - type: markdown
    title: 💶 LLM-Budgets
    content: |-
      {% set budgets = state_attr('sensor.agenten_workflow_status', 'budgets') or {} %}
      {% for alias, b in budgets.items() -%}
      - {{ alias }}: {% if b.fehler is defined %}nicht erreichbar ({{ b.fehler }}){% else %}{{ b.spend }} von {{ b.max }} ({{ b.prozent }} %){% endif %}
      {% endfor %}
      Stand: {{ state_attr('sensor.agenten_workflow_status', 'zeit') }}

  # Steuerungs-Buttons
  - type: horizontal-stack
    cards:
      - type: button
        name: PC Wecken (WoL)
        icon: mdi:power
        tap_action:
          action: call-service
          service: rest_command.wake_llm_pc
      - type: button
        name: Takt Starten
        icon: mdi:play-network
        tap_action:
          action: call-service
          service: shell_command.start_qwen_worker

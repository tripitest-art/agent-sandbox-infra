# Push-Benachrichtigung, wenn der Review-Takt einen PR an Stephan übergibt.
# review_tick.py schreibt dann eine Zeile „PR #N: ⚠ Stephan: <Grund>“ ins Log; sie kommt über den
# Webhook in das Attribut `log` von sensor.qwen_worker_log. Die Automation vergleicht die jeweils
# letzte ⚠-Zeile vor und nach der Änderung, damit jede Meldung genau einmal ankommt.
# `notify.mobile_app_DEIN_HANDY` durch den eigenen Notify-Dienst ersetzen.
alias: "Agenten: PR braucht Stephan"
mode: queued
triggers:
  - trigger: state
    entity_id: sensor.qwen_worker_log
    attribute: log
variables:
  neu: >
    {{ (trigger.to_state.attributes.log or '').split('\n') | select('search', '⚠ Stephan') | list }}
  alt: >
    {{ ((trigger.from_state.attributes.log if trigger.from_state else '') or '').split('\n')
       | select('search', '⚠ Stephan') | list }}
conditions:
  - condition: template
    value_template: "{{ neu | count > 0 and (alt | count == 0 or neu[-1] != alt[-1]) }}"
actions:
  - action: notify.mobile_app_DEIN_HANDY
    data:
      title: "Agenten brauchen dich"
      message: "{{ neu[-1].split('[review] ')[-1] }}"
      data:
        url: "https://github.com/tripitest-art/sc-digger/pulls?q=is%3Aopen+label%3Abraucht-stephan"
        clickAction: "https://github.com/tripitest-art/sc-digger/pulls?q=is%3Aopen+label%3Abraucht-stephan"

# In die configuration.yaml von Home Assistant einfügen:

# 1. REST-Sensor für den WoL-Proxy / Ollama Host
sensor:
  - platform: rest
    name: "LLM Gaming PC"
    resource: http://192.168.0.210:11434/proxy/status
    scan_interval: 10
    value_template: >
      {% if value_json.ollama_up %}
        Arbeitet (Ollama Online)
      {% elif value_json.pc_up %}
        Fährt hoch / Idle
      {% else %}
        Schläft
      {% endif %}
    json_attributes:
      - hw
      - last_wake
      - active_requests

# 2. Webhook-Trigger-Sensor für das Live-Log (umgeht das 255-Zeichen-Limit via Attribut).
#    Die Sandbox schickt neue Zeilen per POST {"lines": "..."} (sandbox/qwen_webhook.py).
#    Webhook-ID nur in secrets.yaml: qwen_worker_webhook_id: "<zufällig, z. B. openssl rand -hex 24>"
template:
  - triggers:
      - trigger: webhook
        webhook_id: !secret qwen_worker_webhook_id
        allowed_methods: [POST]
        local_only: true
    sensor:
      - name: "Qwen Worker Log"
        unique_id: qwen_worker_log
        state: "OK"
        attributes:
          log: >
            {% set current_log = state_attr('sensor.qwen_worker_log', 'log') | default('', true) %}
            {% set new_log = current_log ~ '\n' ~ (trigger.json.lines | default('')) %}
            {{ new_log[-2000:] }}
          # Slot-Status aus dem Webhook; je Slot der zuletzt gemeldete Stand (qwen_webhook.py).
          slots: >
            {% set current = state_attr('sensor.qwen_worker_log', 'slots') | default({}, true) %}
            {{ dict(current, **(trigger.json.slots | default({}, true))) }}

  # 2b. Slot-Telemetrie: je Arbeitsslot ein Sensor, gespeist aus dem Attribut `slots`
  #     des Webhook-Sensors oben (geschrieben von sandbox/worker_tick.py).
  - sensor:
      - name: "Qwen Worker Slot 1"
        unique_id: qwen_worker_slot_1
        variables:
          slot: "1"
          slots: "{{ state_attr('sensor.qwen_worker_log', 'slots') or {} }}"
        state: "{{ slots.get(slot, {}).get('status', 'unbekannt') }}"
        attributes:
          message: "{{ slots.get(slot, {}).get('message', '') }}"
          issue: "{{ slots.get(slot, {}).get('issue', '') }}"
          pr: "{{ slots.get(slot, {}).get('pr', '') }}"
          title: "{{ slots.get(slot, {}).get('title', '') }}"
          branch: "{{ slots.get(slot, {}).get('branch', '') }}"
          model: "{{ slots.get(slot, {}).get('model', '') }}"
          agent: "{{ slots.get(slot, {}).get('agent', '') }}"
          project: "{{ slots.get(slot, {}).get('project', '') }}"
          started_at: "{{ slots.get(slot, {}).get('started_at', '') }}"
          updated_at: "{{ slots.get(slot, {}).get('updated_at', '') }}"

      - name: "Qwen Worker Slot 2"
        unique_id: qwen_worker_slot_2
        variables:
          slot: "2"
          slots: "{{ state_attr('sensor.qwen_worker_log', 'slots') or {} }}"
        state: "{{ slots.get(slot, {}).get('status', 'unbekannt') }}"
        attributes:
          message: "{{ slots.get(slot, {}).get('message', '') }}"
          issue: "{{ slots.get(slot, {}).get('issue', '') }}"
          pr: "{{ slots.get(slot, {}).get('pr', '') }}"
          title: "{{ slots.get(slot, {}).get('title', '') }}"
          branch: "{{ slots.get(slot, {}).get('branch', '') }}"
          model: "{{ slots.get(slot, {}).get('model', '') }}"
          agent: "{{ slots.get(slot, {}).get('agent', '') }}"
          project: "{{ slots.get(slot, {}).get('project', '') }}"
          started_at: "{{ slots.get(slot, {}).get('started_at', '') }}"
          updated_at: "{{ slots.get(slot, {}).get('updated_at', '') }}"

# 3. Steuerungsbefehle
rest_command:
  wake_llm_pc:
    url: "http://192.168.0.210:11434/api/ps"
    method: get
    timeout: 2

shell_command:
  start_qwen_worker: "ssh -i /config/.ssh/id_rsa root@agent-sandbox 'systemctl start --no-block qwen-worker.service'"
